<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17141D">
<title>AscentPeak</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17141D;--s1:#211C2B;--s2:#2A2436;--s3:#352E44;--line:#403852;
  --text:#EDE9F5;--muted:#A79CBA;--dim:#786E8C;
  --brand:#B39DE8;--brand-d:#7B62B8;--brand-dim:#B39DE81F;
  --push:#F7B489;--pull:#8FC0F5;--leg:#7BE3AE;--core:#FFD98A;
  --danger:#FF8A8A;--warn:#F0C862;--onb:#1A1226;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100%}
body{padding-bottom:80px;overscroll-behavior-y:contain}
body.training{padding-bottom:0;overflow:hidden}
.bebas{font-family:'Bebas Neue',sans-serif;letter-spacing:.03em;font-weight:400}
h1,h2,h3{font-family:'Bebas Neue',sans-serif;letter-spacing:.03em;font-weight:400}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 72%,transparent);padding:16px 16px 8px}
.hrow{display:flex;align-items:center;justify-content:space-between;max-width:600px;margin:0 auto;gap:10px}
header h1{font-size:26px;line-height:1}
header h1 em{font-style:normal;color:var(--brand)}
.hmeta{display:flex;align-items:center;gap:8px}
.hdate{font-size:11.5px;color:var(--muted);text-transform:capitalize}
.chip{border:1px solid var(--line);background:var(--s1);color:var(--muted);border-radius:99px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Inter';white-space:nowrap}
.chip.ok{color:var(--brand);border-color:var(--brand-d)}
.chip.warn{color:var(--warn);border-color:#8A7233}
.wrap{padding:0 16px;max-width:600px;margin:0 auto}
.sec{display:none}.sec.on{display:block}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:#1B1724ee;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--dim);font-family:'Inter';font-size:9.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;cursor:pointer}
nav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--brand)}
.pchip{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:99px}
.pc-push{background:#F7B4891F;color:var(--push)}
.pc-pull{background:#8FC0F51F;color:var(--pull)}
.pc-leg{background:#7BE3AE1F;color:var(--leg)}
.pc-core{background:#FFD98A1F;color:var(--core)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.card-h h3{font-size:18px}
.lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
/* tarjeta del día */
.today{background:linear-gradient(160deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
.today:before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent,var(--brand))}
.today .t-lbl{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.today h2{font-size:38px;line-height:.95;margin:4px 0 10px}
.today .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.today .t-meta{display:flex;gap:16px;font-size:11.5px;color:var(--muted);margin-bottom:14px}
.today .t-meta b{color:var(--text);font-weight:700}
.bigbtn{width:100%;padding:16px;border-radius:15px;border:0;background:var(--brand);color:var(--onb);font-family:'Bebas Neue';font-size:23px;letter-spacing:.05em;cursor:pointer}
.bigbtn.ghost{background:var(--s3);color:var(--text)}
.bigbtn:active{transform:scale(.99)}
.tprog{height:6px;background:var(--s3);border-radius:99px;overflow:hidden;margin-bottom:12px}
.tprog>i{display:block;height:100%;background:var(--accent,var(--brand));border-radius:99px;transition:width .4s}
/* semana */
.week{display:flex;gap:6px;margin-bottom:12px}
.wday{flex:1;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:9px 4px;text-align:center;cursor:pointer;position:relative}
.wday .wd{font-size:9.5px;font-weight:800;color:var(--dim);text-transform:uppercase}
.wday .wn{font-family:'Bebas Neue';font-size:17px;line-height:1.15;margin-top:1px}
.wday .wdot{width:100%;height:3px;border-radius:99px;background:var(--s3);margin-top:6px}
.wday.done{border-color:var(--line)}
.wday.done .wn{color:var(--text)}
.wday.today-d{border-color:var(--brand);background:var(--brand-dim)}
.wday.rest .wn{color:var(--dim)}
/* barras de carga */
.loadrow{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.loadrow .ln{width:78px;font-size:11.5px;color:var(--muted);flex-shrink:0}
.loadrow .lb{flex:1;height:8px;background:var(--s3);border-radius:99px;position:relative}
.loadrow .lb>b{position:absolute;top:-3px;bottom:-3px;background:rgba(255,255,255,.05);border-left:1px solid rgba(255,255,255,.20);border-right:1px solid rgba(255,255,255,.20);border-radius:2px;z-index:0}
.loadrow .lb>u{position:absolute;left:0;top:0;height:100%;border-radius:99px;opacity:.3;z-index:1}
.loadrow .lb>i{position:absolute;left:0;top:0;height:100%;border-radius:99px;z-index:2}
.loadrow .lv{width:62px;text-align:right;font-family:'Bebas Neue';font-size:15px;color:var(--muted);flex-shrink:0}
.loadrow .lv em{font-family:Inter,sans-serif;font-style:normal;font-size:9.5px;color:var(--dim);margin-left:2px}
.legend i.lgd{background:var(--muted)}
.legend i.lgi{background:var(--muted);opacity:.3}
.legend i.lgb{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.20)}
.loadrow .lf{width:12px;text-align:center;font-size:11px;color:var(--dim);flex-shrink:0}
.shiftbtn{width:100%;background:none;border:1px dashed var(--line);border-radius:13px;padding:11px;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;font-family:'Inter';margin:-4px 0 12px}
.legend{display:flex;gap:12px;font-size:10.5px;color:var(--dim);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* MODO ENTRENO */
#train{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column}
#train.on{display:flex}
.tr-top{padding:calc(10px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line);flex-shrink:0}
.tr-bar{height:4px;background:var(--s3);border-radius:99px;overflow:hidden;margin-bottom:9px}
.tr-bar>i{display:block;height:100%;background:var(--accent,var(--brand));transition:width .35s}
.tr-nav{display:flex;align-items:center;gap:10px}
.tr-nav .tn-x,.tr-nav .tn-t{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--s1);color:var(--muted);font-size:16px;cursor:pointer;flex-shrink:0}
.tr-nav .tn-i{flex:1;text-align:center;font-size:11.5px;color:var(--muted);font-weight:600}
.tr-body{flex:1;overflow-y:auto;padding:16px 14px 24px}
.exhead h2{font-size:28px;line-height:1.05;margin:8px 0 6px}
.exhead .eh-meta{font-size:11.5px;color:var(--muted);margin-bottom:14px}
.exhead .eh-meta b{color:var(--text)}
.setrow{position:relative;overflow:hidden;display:flex;align-items:center;gap:11px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.setrow.done{cursor:pointer}
.setrow .lpf{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent,var(--brand));opacity:.16;pointer-events:none}
.setrow.lp .lpf{animation:lpfill .6s linear forwards}
@keyframes lpfill{to{width:100%}}
.setrow.xt{border-style:dashed}
.setrow .xtag{font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--accent,var(--brand));border:1px solid var(--line);border-radius:6px;padding:2px 5px}
.addx{width:100%;padding:12px;border-radius:14px;border:1px dashed var(--line);background:transparent;color:var(--muted);font-weight:700;font-size:13px;font-family:'Inter';cursor:pointer;margin-bottom:10px}
.addx:active{transform:scale(.98)}
.fixhint{font-size:10.5px;color:var(--muted);text-align:center;margin:2px 0 12px}
.setrow.done{opacity:.5}
.setrow.act{border-color:var(--accent,var(--brand));background:var(--s2)}
.setrow .sn{width:22px;font-family:'Bebas Neue';font-size:18px;color:var(--dim)}
.setrow.act .sn{color:var(--accent,var(--brand))}
.setrow .sw{flex:1;font-size:13.5px;font-weight:600}
.setrow .sw small{display:block;font-size:10.5px;color:var(--muted);font-weight:400;margin-top:1px}
.setrow .sr{font-family:'Bebas Neue';font-size:19px;color:var(--brand)}
.picker.drop{border-color:var(--leg)}
.drtop{font-size:12px;color:var(--mut);margin:-2px 0 8px;display:flex;flex-wrap:wrap;gap:10px}
.drtop b{color:var(--tx)}
.drdone{opacity:.75}
.sdr{color:var(--leg);font-size:11px;letter-spacing:.3px}
.picker{background:var(--s2);border:1px solid var(--accent,var(--brand));border-radius:16px;padding:14px;margin:4px 0 12px}
.picker .pk-l{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:9px}
.reps{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:11px}
.reps button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--s1);color:var(--text);font-weight:700;font-size:16px;cursor:pointer;font-family:'Inter'}
.reps button.tgt{border-color:var(--brand-d);background:var(--brand-dim);color:var(--brand)}
.reps button:active{transform:scale(.94)}
.wedit{display:flex;gap:8px;align-items:center}
.wedit input{flex:1;background:var(--s1);border:1px solid var(--line);border-radius:11px;color:var(--text);padding:11px;font-size:15px;font-family:'Inter'}
.wedit .wu{font-size:11.5px;color:var(--muted);white-space:nowrap}
.rir{display:flex;gap:8px;margin-bottom:6px}
.rir button{flex:1;padding:14px 4px;border-radius:13px;border:1px solid var(--line);background:var(--s1);color:var(--text);font-weight:800;font-size:19px;cursor:pointer;font-family:'Inter';display:flex;flex-direction:column;align-items:center;gap:2px}
.rir button small{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.rir button:active{transform:scale(.95)}
.rir button.hard{border-color:#8A7233}
.rir button.easy{border-color:var(--brand-d)}
.srir{font-size:10px;color:var(--muted);font-weight:600}
.lastline{font-size:11.5px;color:var(--muted);background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin-bottom:12px}
.lastline b{color:var(--text)}
.exlist .eli{display:flex;align-items:center;gap:11px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.exlist .eli.cur{border-color:var(--accent,var(--brand))}
.exlist .eli.fin{opacity:.5}
.exlist .eli .en{flex:1;min-width:0}
.exlist .eli .en b{font-size:13.5px;font-weight:600;display:block}
.exlist .eli .en span{font-size:11px;color:var(--muted)}
.exlist .eli .ec{font-family:'Bebas Neue';font-size:17px;color:var(--muted)}
.tr-foot{flex-shrink:0;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px}
.tr-foot button{flex:1;padding:13px;border-radius:13px;border:1px solid var(--line);background:var(--s1);color:var(--text);font-weight:700;font-size:13px;cursor:pointer;font-family:'Inter'}
.tr-foot .fnext{background:var(--brand);color:var(--onb);border-color:var(--brand)}
/* descanso pantalla completa */
#rchip{position:fixed;right:14px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:65;display:none;align-items:baseline;gap:7px;background:var(--s1);border:1px solid var(--line);border-radius:99px;padding:7px 14px;box-shadow:0 6px 18px #0006}
#rchip.on{display:flex}
#rchip .rcl{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
#rchip .rcv{font-family:'Bebas Neue';font-size:22px;line-height:1;color:var(--muted)}
#rchip.over{border-color:#8A7233;background:#4A3A1A4D}
#rchip.over .rcv{color:var(--warn)}
#rchip.over .rcl{color:var(--warn);opacity:.75}
#rest{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px}
#rest.on{display:flex}
#rest .rl{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
#rest .rt{font-family:'Bebas Neue';font-size:110px;line-height:.9;margin:8px 0;color:var(--brand)}
#rest.fin .rt{color:var(--push)}
#rest .rn{text-align:center;font-size:14px;color:var(--muted);margin-bottom:6px}
#rest .rn b{color:var(--text);font-size:17px;display:block;margin-top:3px}
#rest .rb{display:flex;gap:10px;margin-top:26px}
#rest .rb button{padding:13px 22px;border-radius:13px;border:1px solid var(--line);background:var(--s1);color:var(--text);font-weight:700;font-size:13px;cursor:pointer;font-family:'Inter'}
#rest .rb .skip{background:var(--brand);color:var(--onb);border-color:var(--brand)}
#rest .rq{display:none;width:100%;max-width:440px;margin-top:20px;overflow-y:auto;max-height:44vh}
#rest.q .rq{display:block}
#rest.q .rt{font-size:52px;margin:2px 0}
#rest.q .rb{margin-top:14px}
#rest .rqi{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:11px;background:var(--s1);border:1px solid var(--line);margin-bottom:6px}
#rest .rqi.done{opacity:.4}
#rest .rqi.now{border-color:var(--brand);background:var(--s2)}
#rest .rqn{flex:1;font-size:13px;font-weight:600;color:var(--text)}
#rest .rqe{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);background:var(--s3);padding:3px 7px;border-radius:6px;white-space:nowrap}
#rest .rqs{font-size:12px;font-weight:700;color:var(--muted);min-width:30px;text-align:right}
/* PROGRESO */
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--s1);color:var(--muted);font-weight:700;font-size:12.5px;cursor:pointer;font-family:'Inter'}
.tabs button.on{background:var(--brand);color:var(--onb);border-color:var(--brand)}
.goal{background:linear-gradient(160deg,#7B62B826,var(--s1));border:1px solid var(--brand-d);border-radius:20px;padding:18px;margin-bottom:12px}
.goal h3{font-size:20px}
.goal .g-now{font-family:'Bebas Neue';font-size:44px;line-height:1;margin:6px 0 2px}
.goal .g-sub{font-size:11.5px;color:var(--muted);margin-bottom:12px}
.goal .g-nums{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:8px}
.goal .g-nums b{color:var(--brand)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.mini{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 13px}
.mini .mn{font-size:9.5px;color:var(--dim);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.mini .mv{font-family:'Bebas Neue';font-size:25px;line-height:1.15;margin:2px 0 1px}
.mini .mm{font-size:10.5px;color:var(--muted)}
.i-good{color:var(--brand)}.i-mid{color:var(--warn)}.i-bad{color:var(--danger)}
.mchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;margin-bottom:4px}
.mchips::-webkit-scrollbar{display:none}
.mchips button{flex-shrink:0;padding:8px 12px;border-radius:99px;border:1px solid var(--line);background:var(--s1);color:var(--muted);font-weight:700;font-size:11.5px;cursor:pointer;font-family:'Inter'}
.mchips button.on{background:var(--brand);color:var(--onb);border-color:var(--brand)}
.exrow{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:7px;display:flex;align-items:center;gap:11px;cursor:pointer}
.exrow .en{flex:1;min-width:0}
.exrow .en b{font-size:13.5px;font-weight:600;display:block}
.exrow .en span{font-size:10.5px;color:var(--muted)}
.exrow .ew{font-family:'Bebas Neue';font-size:18px;color:var(--brand);white-space:nowrap}
/* mapa de calor */
.heat{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.heat .hrowm{display:flex;align-items:center;gap:7px}
.heat .hm{width:26px;font-size:9.5px;color:var(--dim);font-weight:700;text-transform:uppercase;flex-shrink:0}
.heat .hcells{display:flex;gap:3px;flex:1}
.heat .hc{flex:1;aspect-ratio:1;border-radius:4px;background:var(--s2);cursor:pointer;max-width:22px}
.heat .hc.p-push{background:var(--push);color:var(--push)}
.heat .hc.p-pull{background:var(--pull);color:var(--pull)}
.heat .hc.p-leg{background:var(--leg);color:var(--leg)}
.heat .hc.part{background:transparent!important;box-shadow:inset 0 0 0 2px currentColor}
.heat .hc.none{background:var(--s2)}
.monthline{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--muted);background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.monthline b{color:var(--text);font-family:'Bebas Neue';font-size:17px}
.sesrow{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:7px;display:flex;align-items:center;gap:11px;cursor:pointer}
.sesrow .sd{width:52px;font-size:10.5px;color:var(--dim);font-weight:700;text-transform:uppercase}
.sesrow .si{flex:1;min-width:0}
.sesrow .si b{font-size:13px;font-weight:600;display:block}
.sesrow .si span{font-size:10.5px;color:var(--muted)}
.sesrow .sv{font-family:'Bebas Neue';font-size:16px;color:var(--muted)}
/* ENTRENADOR */
.planstate{background:linear-gradient(160deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.planstate .ps-v{font-family:'Bebas Neue';font-size:26px;line-height:1}
.planstate .ps-m{font-size:11.5px;color:var(--muted);margin-top:3px}
.prop{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:9px}
.prop .pp-t{font-size:14px;font-weight:700;margin-bottom:3px}
.prop .pp-c{font-family:'Bebas Neue';font-size:19px;color:var(--brand);margin-bottom:5px}
.prop .pp-m{font-size:12px;color:var(--muted);line-height:1.45;margin-bottom:11px}
.prop .pp-b{display:flex;gap:8px}
.prop .pp-b button{flex:1;padding:10px;border-radius:11px;border:1px solid var(--line);background:var(--s2);color:var(--text);font-weight:700;font-size:12.5px;cursor:pointer;font-family:'Inter'}
.prop .pp-b .ok{background:var(--brand);color:var(--onb);border-color:var(--brand)}
.prop.blocked{border-color:#8A7233}
.prop.blocked .pp-c{color:var(--warn)}
.diary{font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding:9px 0}
.diary b{color:var(--text)}
.aitext{white-space:pre-wrap;font-size:13px;line-height:1.55;background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:14px;max-height:52vh;overflow-y:auto}
/* AJUSTES */
.setrow2{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.setrow2:last-child{border:0}

const DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const DS3=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function tds(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pd(s){const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function db(a,b){return Math.round((pd(b)-pd(a))/86400000)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(m,w){const t=document.getElementById('toast');t.textContent=m;t.className='toast on'+(w?' w':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',2400)}
function ex(id){return CAT.find(e=>e.id===id)}
function pgroup(id){const e=ex(id);return e&&PAT[e.pat]?PAT[e.pat].g:'core'}
function dayGroup(dk){const it=(PLAN.days[dk]||{it:[]}).it;if(!it.length)return null;const c={};it.forEach(i=>{const g=pgroup(i.e);c[g]=(c[g]||0)+i.s});let best=null,mx=0;Object.keys(c).forEach(g=>{if(g!=='core'&&c[g]>mx){mx=c[g];best=g}});return best}
function uOf(x){return x&&x.unit?x.unit:'rep'}
function legW(s){return s&&typeof s.w==='string'}
/* escalera de drop set declarada en el catalogo (pesos planificados de los descensos) */
function grSpan(x){return (x&&Array.isArray(x.gr)&&x.gr.length===2)?x.gr:null}
function drLad(x){
  if(!x||uOf(x)!=='rep')return null;
  if(Array.isArray(x.dr)&&x.dr.length)return x.dr;            /* escalera fija (legacy) */
  if(!Array.isArray(x.stk)||!x.drn||!x.drs)return null;
  const i=x.stk.indexOf(x.w.v);if(i<0)return null;            /* el peso no esta en la torre */
  const out=[];for(let k=1;k<=x.drn;k++){const j=i-k*x.drs;if(j<0)break;out.push(x.stk[j])}
  return out.length?out:null;
}
/* posiciones de la torre: el salto minimo real de la maquina */
function stkStep(x){if(!x||!Array.isArray(x.stk))return null;const i=x.stk.indexOf(x.w.v);return (i>=0&&i+1<x.stk.length)?+(x.stk[i+1]-x.stk[i]).toFixed(1):null}
/* tonelaje de los descensos de una serie */
function drVol(s,ps){return (Array.isArray(s.dr)?s.dr:[]).reduce((a,d)=>a+(d.r||0)*(parseFloat(d.w)||0)*(ps?2:1),0)}
function rLabel(x,r){return uOf(x)==='seg'?r+'s':r}
function wLabel(w){if(!w)return '—';if(w.bw)return w.pl?'Corporal + disco':'Corporal';return w.v+' kg'+(w.ps?' × lado':'')+(w.nt?' ('+w.nt+')':'')}
function setW(it,i){const e=ex(it.e);if(!e)return null;if(e.w.bw)return null;if(it.sc&&it.sc[i]!=null)return it.sc[i];if(it.sc&&it.sc.length)return it.sc[it.sc.length-1];return e.w.v}
function parseR(r){const m=String(r).match(/(\d+)\s*-\s*(\d+)/);if(m)return[+m[1],+m[2]];const s=parseInt(r);return isNaN(s)?[8,12]:[s,s]}
function entry(ds,dk){if(!LOG[ds])LOG[ds]={day:dk,prog:{},sd:{},notes:[]};const e=LOG[ds];if(!e.prog)e.prog={};if(!e.sd)e.sd={};if(!e.notes)e.notes=[];return e}
function dayKeyOf(ds){const e=LOG[ds];return e&&e.day!=null?e.day:pd(ds).getDay()}
function doneSets(e){return Object.values((e&&e.prog)||{}).reduce((a,b)=>a+b,0)}
function planSets(dk,e){if(e&&e.tp!=null)return e.tp;return (PLAN.days[dk]||{it:[]}).it.reduce((a,i)=>a+i.s,0)}
function isDone(ds){const e=LOG[ds];if(!e)return false;const t=planSets(dayKeyOf(ds),e);return t>0&&doneSets(e)>=t}
function volOf(ds){const e=LOG[ds];if(!e||!e.sd)return 0;let v=0;Object.keys(e.sd).forEach(id=>{const x=ex(+id);if(uOf(x)==='seg')return;(e.sd[id]||[]).forEach(s=>{const w=parseFloat(s.w)||0;v+=(s.r||0)*w*(x&&x.w.ps?2:1);v+=drVol(s,x&&x.w.ps)})});return Math.round(v)}
function weekOf(ds){const d=pd(ds),m=new Date(d);m.setDate(m.getDate()-((m.getDay()+6)%7));const a=[];for(let i=0;i<7;i++){const x=new Date(m);x.setDate(x.getDate()+i);a.push(tds(x))}return a}
function loadByGroup(days){
  const acc={};GRUPOS.forEach(g=>acc[g]={d:0,i:0});
  const hoy=tds();
  Object.keys(LOG).forEach(ds=>{
    if(db(ds,hoy)>days||db(ds,hoy)<0)return;
    const e=LOG[ds];
    const ids={};
    Object.keys(e.prog||{}).forEach(k=>ids[k]=1);
    Object.keys(e.sd||{}).forEach(k=>ids[k]=1);
    Object.keys(ids).forEach(id=>{
      const x=ex(+id);if(!x)return;
      const sd=(e.sd||{})[id];
      const n=(sd&&sd.length)?sd.length:(e.prog[id]||0);
      if(acc[x.pri])acc[x.pri].d+=n;
      (x.sec||[]).forEach(s=>{if(acc[s])acc[s].i+=n*0.5});
    });
  });
  return acc;
}
function aqFrozen(){const h=tds();let until=null;Object.keys(LOG).forEach(ds=>{if(LOG[ds].aq&&db(ds,h)<=14){const u=new Date(pd(ds));u.setDate(u.getDate()+14);const s=tds(u);if(!until||s>until)until=s}});return until}
function estDur(dk){const arr=[];Object.keys(LOG).sort().reverse().forEach(ds=>{if(arr.length>=4)return;const e=LOG[ds];if(dayKeyOf(ds)===dk&&e.t0&&e.t1&&isDone(ds))arr.push(e.t1-e.t0)});if(!arr.length)return null;const avg=arr.reduce((a,b)=>a+b,0)/arr.length;return Math.round(avg/60000)}
function fmtMin(m){if(m==null)return '—';return m>=60?Math.floor(m/60)+'h '+String(m%60).padStart(2,'0'):m+' min'}
function lastSets(id,before){const dss=Object.keys(LOG).sort().reverse();for(const ds of dss){if(before&&ds>=before)continue;const a=(LOG[ds].sd||{})[id];if(a&&a.length)return{ds,a}}return null}
/* ============ NAV ============ */
function go(t){
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));
  document.getElementById('s-'+t).classList.add('on');
  document.getElementById('n-'+t).classList.add('on');
  if(t==='entrenar')rEntrenar();if(t==='progreso')rProgreso();if(t==='coach')rCoach();if(t==='ajustes')rAjustes();
  window.scrollTo(0,0);
}
function accentOf(g){return g==='push'?'var(--push)':g==='pull'?'var(--pull)':g==='leg'?'var(--leg)':'var(--core)'}
/* ============ ENTRENAR ============ */
function rEntrenar(){
  const now=new Date(),ds=tds(now);
  document.getElementById('hdate').textContent=DS3[now.getDay()]+' '+now.getDate()+' '+MESES[now.getMonth()].toLowerCase().slice(0,3);
  const dk=dayKeyOf(ds),d=PLAN.days[dk]||PLAN.days[0];
  const e=LOG[ds],tot=planSets(dk,e),dn=doneSets(e);
  const g=dayGroup(dk),ac=accentOf(g);
  const dur=estDur(dk);
  let html='';
  const fr=aqFrozen();
  if(fr)html+=`<div class="warnbox">🧊 Protocolo Aquiles activo — progresión congelada en hack, gemelos y búlgaras hasta el ${fr}</div>`;
  if(dk===0&&dn===0){
    html+=`<div class="today" style="--accent:var(--muted)">
      <div class="t-lbl">Hoy</div><h2>DESCANSO</h2>
      <div class="t-meta"><span>Mañana toca <b>${esc(PLAN.days[(now.getDay()+1)%7].l)}</b></span></div>
      <button class="bigbtn ghost" onclick="pickDay('${ds}')">Entrenar igual</button></div>`;
  }else{
    const pats=[...new Set(d.it.map(i=>ex(i.e)&&ex(i.e).pat).filter(Boolean))];
    let chips='';pats.slice(0,4).forEach(p=>{chips+=`<span class="pchip pc-${PAT[p].g}">${PAT[p].n}</span>`});
    const pct=tot?Math.round(dn/tot*100):0;
    html+=`<div class="today" style="--accent:${ac}">
      <div class="t-lbl">Hoy · ${DIAS[now.getDay()]}</div>
      <h2>${esc(d.l).toUpperCase()}</h2>
      <div class="chips">${chips}</div>
      ${dn>0?`<div class="tprog"><i style="width:${pct}%"></i></div>`:''}
      <div class="t-meta"><span><b>${d.it.length}</b> ejercicios</span><span><b>${tot}</b> series</span><span>≈ <b>${fmtMin(dur)}</b></span></div>
      <button class="bigbtn" onclick="startTrain('${ds}')">${dn>=tot&&tot>0?'REVISAR ✓':(dn>0?'CONTINUAR · '+dn+'/'+tot:'EMPEZAR')}</button></div>`;
  }
  if(dn===0){
    const _sa=shiftAmt(ds);
    html+=`<button class="shiftbtn" onclick="shiftWeek('${ds}')">🔁 Recorrer rutinas +1 día (cubrir un día perdido)${_sa?' · vas +'+_sa:''}</button>`;
    if(hasShift(ds))html+=`<button class="shiftbtn" onclick="clearShift('${ds}')">↩ Restaurar semana estándar</button>`;
  }
  const wk=weekOf(ds);
  html+=`<div class="lbl" style="margin:2px 0 8px">Tu semana</div><div class="week">`;
  wk.forEach(x=>{
    const k=dayKeyOf(x),dd=pd(x),done=isDone(x),some=doneSets(LOG[x])>0;
    const gg=dayGroup(k),col=gg?accentOf(gg):'var(--s3)';
    html+=`<div class="wday ${done?'done':''} ${x===ds?'today-d':''} ${k===0?'rest':''}" onclick="openDay('${x}')">
      <div class="wd">${DS3[dd.getDay()].slice(0,1)}</div><div class="wn">${dd.getDate()}</div>
      <div class="wdot" style="background:${done?col:(some?col:'var(--s3)')};opacity:${done?1:(some?.45:1)}"></div></div>`;
  });
  html+=`</div>`;
  const acc=loadByGroup(14);
  const mx=Math.max(1,...GRUPOS.map(g=>acc[g].d+acc[g].i),...GRUPOS.map(g=>RANGO[g][1]));
  const pc=n=>Math.round(n/mx*100);
  html+=`<div class="card"><div class="card-h"><h3>Carga 14 días</h3><span class="lbl">series directas</span></div>`;
  GRUPOS.forEach(gr=>{
    const dr=Math.round(acc[gr].d),ay=Math.round(acc[gr].i),R=RANGO[gr];
    const cls=dr<R[0]?'low':(dr>R[1]?'high':'opt');
    const col=gcol(gr),extra=ay?'<em>+'+ay+'</em>':'';
    const fl=cls==='low'?'↓':(cls==='high'?'↑':'');
    html+=`<div class="loadrow ${cls}"><span class="ln">${gr}</span>
    <span class="lb"><b style="left:${pc(R[0])}%;width:${pc(R[1]-R[0])}%"></b><u style="width:${pc(dr+ay)}%;background:${col}"></u><i style="width:${pc(dr)}%;background:${col}"></i></span>
    <span class="lf">${fl}</span><span class="lv">${dr}${extra}</span></div>`;
  });
  html+=`<div class="legend"><span><i class="lgd"></i>directas</span><span><i class="lgi"></i>ayuda</span><span><i class="lgb"></i>rango objetivo</span><span>↓ por debajo del rango · ↑ por encima</span></div></div>`;
  document.getElementById('s-entrenar').innerHTML=html;
}
function pickDay(ds){
  let o='';[1,2,3,4,5,6].forEach(d=>o+=`<option value="${d}">${esc(PLAN.days[d].l)}</option>`);
  openM(`<h2>Entrenar hoy</h2><div class="sub">Elige qué sesión quieres hacer</div><select id="pk">${o}</select>
  <div class="mb"><button onclick="closeM()">Cancelar</button><button class="ok" onclick="doPick('${ds}')">Empezar</button></div>`);
}
function doPick(ds){
  const d=+document.getElementById('pk').value;
  const prev=LOG[ds]||{};
  LOG[ds]={day:d,prog:{},sd:prev.sd||{},notes:prev.notes||[]};
  saveLog(ds);closeM();startTrain(ds);
}
function openDay(ds){
  const dk=dayKeyOf(ds),e=LOG[ds],d=PLAN.days[dk];
  if(ds===tds()){startTrain(ds);return}
  const dd=pd(ds);
  let h=`<h2>${DS3[dd.getDay()]} ${dd.getDate()} ${MESES[dd.getMonth()].toLowerCase()}</h2><div class="sub">${esc(d.l)}</div>`;
  if(!e||doneSets(e)===0){h+=`<p class="empty">Sin registro este día</p>`}
  else{
    const tot=planSets(dk,e),dn=doneSets(e);
    h+=`<div class="lastline"><b>${dn}/${tot}</b> series · <b>${(volOf(ds)/1000).toFixed(1)} t</b> de volumen${e.t0&&e.t1?' · '+fmtMin(Math.round((e.t1-e.t0)/60000)):''}${e.light?' · 🔋 ligera':''}</div>`;
    Object.keys(e.sd||{}).forEach(id=>{
      const x=ex(+id);if(!x)return;
      h+=`<div class="exrow"><div class="en"><b>${esc(x.n)}</b><span>${(e.sd[id]||[]).map(s=>rLabel(x,s.r)+(s.w?'@'+s.w:'')+(s.rir!=null?' (RIR '+s.rir+')':'')+(s.xt?'+':'')).join(' · ')}</span></div></div>`;
    });
    (e.notes||[]).forEach(n=>{h+=`<div class="diary">📝 <b>${n.t}</b> — ${esc(n.txt)}</div>`});
  }
  h+=`<div class="mb"><button onclick="closeM()">Cerrar</button></div>`;
  openM(h);
}
function weekEff(ds){return weekOf(ds).map(x=>dayKeyOf(x))}
function hasShift(ds){
  const wk=weekOf(ds),i=wk.indexOf(ds);
  for(let j=i;j<7;j++){const e=LOG[wk[j]];if(e&&e.day!=null&&e.day!==pd(wk[j]).getDay()&&doneSets(e)===0)return true}
  return false;
}
function shiftWeek(ds){
  const wk=weekOf(ds),i=wk.indexOf(ds);
  if(i<=0){toast('Es lunes — no hay día previo que cubrir');return}
  const ef=weekEff(ds);
  let plan='';
  for(let j=i;j<7;j++){
    const nk=prevK(ef[j]);
    plan+=DS3[pd(wk[j]).getDay()]+': '+(PLAN.days[nk]?PLAN.days[nk].l:'—')+(j<6?' · ':'');
  }
  const ac=shiftAmt(ds);
  openM(`<h2>🔁 Recorrer +1 día</h2><div class="sub">Cada día restante retrocede una sesión del ciclo. El domingo absorbe el hueco.${ac?' Ya llevas +'+ac+'.':''}</div>
  <div class="lastline">${esc(plan)}</div>
  <div class="mb"><button onclick="closeM()">Cancelar</button><button class="ok" onclick="doShift('${ds}')">Recorrer</button></div>`);
}
function prevK(k){return (k+6)%7}
function shiftAmt(ds){return (pd(ds).getDay()-dayKeyOf(ds)+7)%7}
function doShift(ds){
  const wk=weekOf(ds),i=wk.indexOf(ds),ef=weekEff(ds);
  for(let j=i;j<7;j++){
    const x=wk[j],e=LOG[x];
    if(e&&doneSets(e)>0)continue;
    const nk=prevK(ef[j]);
    const en=entry(x,nk);en.day=nk;saveLog(x);
  }
  closeM();rEntrenar();
  toast('🔁 Hoy toca '+PLAN.days[dayKeyOf(ds)].l);
}
function clearShift(ds){
  const wk=weekOf(ds),i=wk.indexOf(ds);
  for(let j=i;j<7;j++){const x=wk[j],e=LOG[x];if(e&&doneSets(e)===0){delete e.day;saveLog(x)}}
  rEntrenar();toast('Semana estándar restaurada');
}

/* ============ MODO ENTRENO ============ */
let TR={ds:null,dk:0,i:0,mode:'focus'};
function startTrain(ds){
  const dk=dayKeyOf(ds);
  if(dk===0&&!(LOG[ds]&&LOG[ds].day!=null)){pickDay(ds);return}
  TR.ds=ds;TR.dk=dk;TR.i=0;
  const e=entry(ds,dk),d=PLAN.days[dk];
  for(let i=0;i<d.it.length;i++){if((e.prog[d.it[i].e]||0)<d.it[i].s){TR.i=i;break}}
  document.body.classList.add('training');
  document.getElementById('train').classList.add('on');
  drawTrain();
}
function exitTrain(){
  document.body.classList.remove('training');
  document.getElementById('train').classList.remove('on');
  stopRest();chipOff();rEntrenar();
}
function toggleTrainMode(){TR.mode=TR.mode==='focus'?'list':'focus';drawTrain()}
function drawTrain(){
  const {ds,dk}=TR,d=PLAN.days[dk],e=entry(ds,dk);
  const tot=planSets(dk,e),dn=doneSets(e);
  const g=dayGroup(dk),ac=accentOf(g);
  document.getElementById('train').style.setProperty('--accent',ac);
  document.getElementById('trbar').style.width=(tot?Math.round(dn/tot*100):0)+'%';
  document.getElementById('trtog').textContent=TR.mode==='focus'?'☰':'▣';
  const body=document.getElementById('trbody'),foot=document.getElementById('trfoot');
  if(TR.mode==='list'){
    document.getElementById('trinfo').textContent=d.l+' · '+dn+'/'+tot+' series';
    let h='<div class="exlist">';
    d.it.forEach((it,i)=>{
      const x=ex(it.e);if(!x)return;
      const done=e.prog[it.e]||0;
      h+=`<div class="eli ${i===TR.i?'cur':''} ${done>=it.s?'fin':''}" onclick="TR.i=${i};TR.mode='focus';drawTrain()">
      <span class="pchip pc-${PAT[x.pat].g}" style="padding:3px 7px;font-size:9px">${PAT[x.pat].n.split(' ')[0]}</span>
      <span class="en"><b>${esc(x.n)}</b><span>${it.s}×${esc(it.r)} · ${wLabel(x.w)}</span></span>
      <span class="ec">${done}/${it.s}</span></div>`;
    });
    h+='</div>';
    body.innerHTML=h;
    foot.innerHTML=`<button onclick="openNote()">📝 Nota</button><button class="fnext" onclick="TR.mode='focus';drawTrain()">Volver a entrenar</button>`;
    return;
  }
  const it=d.it[TR.i];
  if(!it){body.innerHTML='<p class="empty">Sin ejercicios</p>';foot.innerHTML='';return}
  const x=ex(it.e);
  const done=e.prog[it.e]||0;
  const prev=lastSets(it.e,ds);
  document.getElementById('trinfo').textContent='Ejercicio '+(TR.i+1)+' de '+d.it.length;
  let h=`<div class="exhead"><span class="pchip pc-${PAT[x.pat].g}">${PAT[x.pat].n}</span>
  <h2>${esc(x.n)}</h2>
  <div class="eh-meta">${esc(x.pri)}${x.sec.length?' · '+x.sec.join(', '):''} — <b>${wLabel(x.w)}</b> · descanso ${Math.floor(x.rest/60)}:${String(x.rest%60).padStart(2,'0')}</div></div>`;
  if(prev)h+=`<div class="lastline">Última vez (${prev.ds.slice(5)}): <b>${prev.a.map(s=>rLabel(x,s.r)).join(', ')}</b>${prev.a[0]&&prev.a[0].w?' @ '+prev.a[0].w+' kg':''}</div>`;
  const arr=(e.sd[it.e]||[]);
  const PL=[],XT=[];
  arr.forEach((s,k)=>{(s.xt?XT:PL).push({s,k})});
  const lpAttr=k=>`oncontextmenu="return false" onpointerdown="lpStart(this,${k},event)" onpointerup="lpCancel()" onpointerleave="lpCancel()" onpointercancel="lpCancel()" onpointermove="lpMove(event)"`;
  const srTxt=r=>rLabel(x,r.s.r)+(Array.isArray(r.s.dr)&&r.s.dr.length?'<span class="sdr"> \u25be'+r.s.dr.map(d=>d.r).join('\u00b7')+'</span>':'')+(r.s.rir!=null?'<span class="srir"> RIR '+r.s.rir+'</span>':'');
  for(let i=0;i<it.s;i++){
    const rec=PL[i],hecho=!!rec,act=(!rec&&i===PL.length);
    const w=setW(it,i);
    h+=`<div class="setrow ${hecho?'done':''} ${act?'act':''}" ${hecho?lpAttr(rec.k):''}>
      ${hecho?'<span class="lpf"></span>':''}
      <span class="sn">${i+1}</span>
      <span class="sw">${hecho?(rec.s.w!=null?rec.s.w+' kg':wLabel(x.w)):(w!=null?w+' kg'+(x.w.ps?' × lado':''):wLabel(x.w))}
      <small>${hecho?(rec.s.ed?'corregida':'hechas'):'objetivo '+it.r+(uOf(x)==='seg'?'':' reps')}</small></span>
      <span class="sr">${hecho?srTxt(rec):'—'}</span></div>`;
    if(act){
      const [a,b]=parseR(it.r);
      const seg=uOf(x)==='seg',step=seg?5:1;
      const gs=grSpan(x);
      const lo=gs?gs[0]:(seg?Math.max(5,Math.round((a-10)/5)*5):Math.max(1,a-3));
      const hi=gs?gs[1]:(seg?b+15:b+2);
      const lad=drLad(x),enDr=!!(DRP&&lad);
      let reps='';
      for(let r=lo;r<=hi;r+=step)reps+=`<button class="${r>=a&&r<=b?'tgt':''}" onclick="doSet(${r})">${r}${seg?'s':''}</button>`;
      if(enDr){
        const j=DRP.dr.length,wd=lad[j];
        /* el descenso no tiene objetivo: peso fijo, se lleva hasta donde llegue.
           Grilla ancha y SIN resaltado — un boton en verde aqui estira el numero. */
        reps='';for(let r=lo;r<=hi;r+=step)reps+=`<button onclick="doSet(${r})">${r}</button>`;
        const hechos=DRP.dr.map((d,q)=>`<span class="drdone">${lad[q]} kg → <b>${d.r}</b></span>`).join('');
        h+=`<div class="picker drop"><div class="pk-l">↓ Descenso ${j+1} de ${lad.length} · <b>${wd} kg</b> — ¿cuántas hiciste?</div>
        <div class="drtop">Arriba: ${DRP.w!=null?DRP.w+' kg':''} → <b>${DRP.r}</b>${hechos}</div>
        <div class="reps">${reps}</div></div>`;
      }else{
        h+=`<div class="picker"><div class="pk-l">Serie ${i+1} · ${seg?'¿cuántos segundos aguantaste?':'¿cuántas hiciste?'}${lad?' <small>(drop set de '+(lad.length+1)+' escalones)</small>':''}</div>
        <div class="reps">${reps}</div>

    ${arriba?'':`<div class="drtop">Arriba: ${wTop} kg → <b>${DRP.r}</b>${DRP.dr.map((d,q)=>`<span class="drdone">${lad2[q]} kg → <b>${d.r}</b></span>`).join('')}</div>`}
    <div class="reps">${g2}</div>

function prevEx(){if(DRP&&!confirm('Hay un drop set a medias. ¿Descartarlo?'))return;DRP=null;if(TR.i>0){TR.i--;drawTrain()}}
function nextEx(){

let DRP=null;
function doSet(reps){
  const {ds,dk}=TR,d=PLAN.days[dk],it=d.it[TR.i],x=ex(it.e);
  const e=entry(ds,dk);
  const cur=e.prog[it.e]||0;
  const esXt=!!(DRP&&DRP.xt);
  if(cur>=it.s&&!esXt)return;
  const lad=drLad(x);
  if(lad){
    if(!DRP||DRP.r==null){
      const wi=document.getElementById('sw');
      const wv=wi&&wi.value!==''?parseFloat(wi.value):setW(it,Math.min(cur,it.s-1));
      DRP=DRP?Object.assign(DRP,{r:reps,w:wv}):{r:reps,w:wv,dr:[]};
      if(navigator.vibrate)navigator.vibrate(15);
      drawTrain();return;
    }
    DRP.dr.push({w:lad[DRP.dr.length],r:reps});
    if(DRP.dr.length<lad.length){if(navigator.vibrate)navigator.vibrate(15);drawTrain();return}
    const p=DRP;DRP=null;
    PEND={reps:p.r,w:p.w,dr:p.dr,xt:p.xt};
    if(p.xt||(cur+1)>=it.s){askRIR(x);return}
    PEND=null;recordSet(p.r,p.w,null,p.dr);return;
  }
  const wi=document.getElementById('sw');
  const w=wi&&wi.value!==''?parseFloat(wi.value):null;
  if((cur+1)>=it.s){PEND={reps,w};askRIR(x);return}
  recordSet(reps,w,null);
}

/* BARANDA AQUILES — un RIR bajo el piso en ejercicio sensible congela la progresion 14 dias */
function aqCheck(e,x,rir){
  if(rir==null||rir>=2||!x||x.aq<1)return false;
  e.aq=true;
  toast('🧊 '+x.n+': RIR '+rir+' bajo el piso del protocolo — progresión congelada 14 días',true);
  return true;
}
function recordSet(reps,w,rir,dr){
  const {ds,dk}=TR,d=PLAN.days[dk],it=d.it[TR.i],x=ex(it.e);
  const e=entry(ds,dk);
  const cur=e.prog[it.e]||0;
  if(cur>=it.s)return;
  e.prog[it.e]=cur+1;
  if(!e.sd[it.e])e.sd[it.e]=[];
  const rec={r:reps};
  if(w!=null)rec.w=w;
  if(Array.isArray(dr)&&dr.length)rec.dr=dr;
  if(rir!=null)rec.rir=rir;
  if(rir!=null&&rir<2&&x.aq>=1)rec.rf=1;
  rec.ts=Date.now();
  e.sd[it.e].push(rec);
  const now=Date.now();if(!e.t0)e.t0=now;e.t1=now;
  saveLog(ds);
  if(navigator.vibrate)navigator.vibrate(25);
  aqCheck(e,x,rir);
  const tot=planSets(dk,e);
  if(doneSets(e)>=tot){drawTrain();finishDay();return}
  const last=(cur+1)>=it.s;
  if(last&&TR.i<d.it.length-1)TR.i++;
  drawTrain();
  startRest(x.rest,last?'Siguiente ejercicio':'Serie '+(cur+2)+' de '+it.s);
}

function lpCancel(){if(!LP)return;clearTimeout(LP.t);LP.el.classList.remove('lp');LP=null}

/* ===== hoja de corrección · k = índice real en sd, -1 = serie extra nueva ===== */
function openFix(k){
  const {ds,dk}=TR,d=PLAN.days[dk],it=d.it[TR.i],x=ex(it.e);
  const e=entry(ds,dk),arr=e.sd[it.e]||[];
  const nueva=k<0;
  const s=nueva?null:arr[k];
  if(!nueva&&!s)return;
  const [a,b]=parseR(it.r);
  const ult=arr.length?arr[arr.length-1]:null;
  const rDef=nueva?(ult&&ult.r!=null?ult.r:a):s.r;
  let wDef=nueva?(ult&&ult.w!=null?ult.w:setW(it,it.s-1)):(s.w!=null?s.w:null);
  const rirDef=nueva?null:(s.rir!=null?s.rir:null);
  const esX=nueva||!!s.xt;
  const num=arr.filter(z=>!z.xt).length;
  const et=esX?'Serie extra':'Serie '+(arr.slice(0,k).filter(z=>!z.xt).length+1);
  const seg=uOf(x)==='seg',step=seg?5:1;
  const glo=seg?Math.max(5,Math.round((a-10)/5)*5):Math.max(1,a-4),ghi=seg?b+15:b+4;
  let g='';for(let r=glo;r<=ghi;r+=step)g+=`<button class="${r===rDef?'tgt':''}" onclick="fxR(${r},this)">${r}${seg?'s':''}</button>`;
  openM(`<h2>${nueva?'Serie extra':'Corregir'}</h2>
  <div class="sub">${esc(x.n)} — ${nueva?'la que salió de más, fuera del plan ('+num+'+1)':et+' registrada el '+ds.slice(5)}</div>
  <div class="pk-l" style="font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:4px 0 8px">${seg?'Segundos':'Repeticiones'}</div>
  <div class="reps">${g}</div>
  <div class="wedit"><input id="fxr" type="number" inputmode="numeric" value="${rDef!=null?rDef:''}"><span class="wu">${seg?'seg':'reps'}</span></div>
  <div class="wedit" style="margin-top:8px"><input id="fxw" type="number" step="0.5" inputmode="decimal" value="${wDef!=null?wDef:''}" placeholder="peso"><span class="wu">kg${x.w.ps?' × lado':''}</span></div>
  <div class="wedit" style="margin-top:8px"><select id="fxq" style="flex:1;background:var(--s1);border:1px solid var(--line);border-radius:11px;color:var(--text);padding:11px;font-size:15px;font-family:'Inter'">
    <option value=""${rirDef==null?' selected':''}>sin RIR</option>
    <option value="3"${rirDef===3?' selected':''}>RIR 3+ · cómodo</option>
    <option value="2"${rirDef===2?' selected':''}>RIR 2 · duro</option>
    <option value="1"${rirDef===1?' selected':''}>RIR 1 · casi</option>
    <option value="0"${rirDef===0?' selected':''}>RIR 0 · al fallo</option>
  </select><span class="wu">reserva</span></div>
  <div class="mb"><button onclick="closeM()">Cancelar</button><button class="ok" onclick="saveFix(${k})">Guardar</button></div>
  ${nueva?'':`<div class="mb"><button onclick="askDel(${k})">🗑️ Eliminar esta serie</button></div>`}`);
}
function fxR(r,el){

function noteFix(e,txt){

function saveFix(k){
  const {ds,dk}=TR,d=PLAN.days[dk],it=d.it[TR.i],x=ex(it.e);
  const e=entry(ds,dk);
  if(!e.sd[it.e])e.sd[it.e]=[];
  const arr=e.sd[it.e];
  const r=parseInt(document.getElementById('fxr').value,10);
  if(isNaN(r)||r<1){toast('Pon cuántas repeticiones hiciste',1);return}
  const wv=document.getElementById('fxw').value;
  const q=document.getElementById('fxq').value;
  const w=wv===''?null:parseFloat(wv);
  const rir=q===''?null:+q;
  const et=v=>v.r+(v.w!=null?'@'+v.w+'kg':'');
  if(k<0){
    const rec={r,xt:1};
    if(w!=null)rec.w=w;
    if(rir!=null)rec.rir=rir;
    if(rir!=null&&rir<2&&x.aq>=1)rec.rf=1;
    aqCheck(e,x,rir);
    rec.ts=Date.now();
    arr.push(rec);
    noteFix(e,'➕ '+x.n+': serie extra '+et(rec)+' (fuera del plan)');
    toast('Serie extra registrada');
  }else{
    const s=arr[k];if(!s){closeM();return}
    const antes=et(s);
    s.r=r;
    if(w!=null)s.w=w;else delete s.w;
    if(rir!=null)s.rir=rir;else delete s.rir;
    if(rir!=null&&rir<2&&x.aq>=1)s.rf=1;else delete s.rf;
    aqCheck(e,x,rir);
    const ahora=et(s);
    if(antes===ahora){closeM();drawTrain();return}
    s.ed=1;
    noteFix(e,'✏️ '+x.n+' serie '+(k+1)+': '+antes+' → '+ahora);
    toast('Serie corregida');
  }
  const now=Date.now();if(!e.t0)e.t0=now;e.t1=now;
  saveLog(ds);closeM();drawTrain();
}
function addExtra(){
  const {dk}=TR,it=PLAN.days[dk].it[TR.i],x=ex(it.e);
  if(drLad(x)){DRP={r:null,w:null,dr:[],xt:1};drawTrain();return}
  openFix(-1);
}
/* serie extra ya cerrada: no toca prog (§ lo planificado y lo ejecutado son dos numeros) */
function recExtra(reps,w,rir,dr){
  const {ds,dk}=TR,it=PLAN.days[dk].it[TR.i],x=ex(it.e);
  const e=entry(ds,dk);
  if(!e.sd[it.e])e.sd[it.e]=[];

  if(w!=null)rec.w=w;
  if(rir!=null)rec.rir=rir;
  if(rir!=null&&rir<2&&x.aq>=1)rec.rf=1;
  if(Array.isArray(dr)&&dr.length)rec.dr=dr;
  rec.ts=Date.now();
  e.sd[it.e].push(rec);
  noteFix(e,'➕ '+x.n+': serie extra '+reps+(w!=null?'@'+w+'kg':'')+(rec.dr?' ▾'+rec.dr.map(v=>v.r).join('·'):'')+' (fuera del plan)');
  e.t1=Date.now();
  saveLog(ds);

function askDel(k){
  const {ds,dk}=TR,it=PLAN.days[dk].it[TR.i];

function delSet(k){

function finishDay(){
  const {ds,dk}=TR,e=entry(ds,dk);

/* ============ PROGRESO ============ */

/* Lo que Jhair hizo DE VERDAD la ultima vez. El catalogo y el plan solo cambian
   cuando se aplica una propuesta, asi que se quedan viejos si progresa solo. */
/* Orden real de ejecucion y descanso real entre series, a partir de ts.
   Las sesiones anteriores al 05/08 no tienen ts: caen al orden del plan. */
function ordOf(e,dk){
  const ids=Object.keys(e.sd||{});
  const pl=((PLAN.days[dk]||{}).it||[]).map(i=>String(i.e));
  return ids.slice().sort((a,b)=>{
    const ta=tsMin(e.sd[a]),tb=tsMin(e.sd[b]);
    if(ta!=null&&tb!=null)return ta-tb;
    if(ta!=null)return -1;
    if(tb!=null)return 1;
    const ia=pl.indexOf(a),ib=pl.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib);
  });
}
function tsMin(ser){
  const t=(ser||[]).filter(s=>s.ts).map(s=>s.ts);
  return t.length?Math.min.apply(null,t):null;
}
function restOf(ser){
  const t=(ser||[]).filter(s=>s.ts).map(s=>s.ts).sort((a,b)=>a-b);
  if(t.length<2)return null;
  const g=[];for(let i=1;i<t.length;i++){const d=Math.round((t[i]-t[i-1])/1000);if(d>10&&d<900)g.push(d)}
  if(!g.length)return null;
  return Math.round(g.reduce((a,b)=>a+b,0)/g.length);
}
function mmss(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function realMap(){
  const m={},hoy=tds();
  Object.keys(LOG).sort().forEach(ds=>{
    const sd=(LOG[ds]||{}).sd||{};
    Object.keys(sd).forEach(id=>{
      const ser=sd[id]||[];if(!ser.length)return;
      const ws=ser.filter(s=>typeof s.w==='number').map(s=>s.w);
      const w=ws.length?Math.max.apply(null,ws):null;
      const e=m[+id]||(m[+id]={mx:null,mxd:null});
      e.d=ds;e.n=ser.length;e.w=w;
      if(w!=null&&db(ds,hoy)<=21&&(e.mx==null||w>e.mx)){e.mx=w;e.mxd=ds}
    });
  });
  return m;
}
/* El rango de reps depende del DIA: press militar es 6-8 en Push A y 8-10 en Push B */
function rngFor(id,ds){
  const it=((PLAN.days[dayKeyOf(ds)]||{}).it||[]).find(t=>t.e===id);
  return it?parseR(it.r):null;
}
/* Doble progresion calculada en codigo, no dejada a criterio de la IA:
   cuantas sesiones seguidas cerro TODAS las series en el tope del rango. */
function dblProg(){
  const out=[],hoy=tds();
  CAT.forEach(x=>{
    if(uOf(x)!=='rep')return;
    const ses=Object.keys(LOG).sort().filter(ds=>(((LOG[ds]||{}).sd||{})[x.id]||[]).length);
    let n=0,pw=null,a=null,b=null,last=null;
    for(let k=ses.length-1;k>=0;k--){
      const ds=ses[k];
      if(db(ds,hoy)>21)break;                            /* fuera de ventana */
      const ser=LOG[ds].sd[x.id],r=rngFor(x.id,ds);
      if(!r)break;
      const ws=ser.filter(v=>typeof v.w==='number').map(v=>v.w);
      const w=ws.length?Math.max.apply(null,ws):(x.w.bw?0:null);
      if(w==null)break;                                  /* legacy o sin peso */
      if(!ser.every(v=>(v.r||0)>=r[1]))break;            /* no cerró en el tope */
      if(pw!==null&&Math.abs(w-pw)>0.01)break;           /* peso distinto: corta */
      pw=w;a=r[0];b=r[1];if(!last)last=ds;n++;
    }
    if(n>=2)out.push({x:x,n:n,a:a,b:b,w:pw,d:last});
  });
  return out;
}

       +(rs?' · descanso real ~'+mmss(rs)+' (plan '+mmss(x.rest||90)+')':'')+'\n';

      try{props=JSON.parse(raw)}

        const objs=raw.match(/\{[^{}]*\}/g)||[];
        objs.forEach(s=>{try{const p=JSON.parse(s);if(p&&p.ex!=null)props.push(p)}catch(x){}});
      }
    }
    if(!Array.isArray(props))props=[];
    txt=txt.replace(/\*\*/g,'').replace(/^#+\s*/gm,'').replace(/^\s*[-–]\s+/gm,'· ').trim();
    props=props.filter(p=>{
      const x=ex(p.ex);if(!x||p.tipo!=='peso')return false;
      const cur=x.w.bw?0:x.w.v;
      const iso=['iso_bi','iso_tri','iso_delt','iso_leg','core','calf'].includes(x.pat);
      const max=iso?2:5;
      if(cur>0&&p.valor>cur+max){p.motivo=(p.motivo||'')+' [ajustado al tope seguro]';p.valor=cur+max;if(p.esquema)delete p.esquema}

  }catch(e){
    const msg=String(e.message||e);
    let ay='';
    if(msg.includes('401')||msg.toLowerCase().includes('auth'))ay='<br><br>Clave inválida — revísala.';
    if(msg.toLowerCase().includes('credit')||msg.toLowerCase().includes('billing'))ay='<br><br>Falta crédito en console.anthropic.com';
    openM(`<h2>⚠️ Error</h2><div class="sub">${esc(msg)}${ay}</div><div class="mb"><button onclick="closeM()">Cerrar</button><button class="ok" onclick="runAI()">Reintentar</button></div>`);
  }
}

function appProp(i){
  const props=ld('g2_props',[]),p=props[i];if(!p)return;
  const x=ex(p.ex);if(!x)return;
  const prev=x.w.bw?0:x.w.v;
  /* BARANDA 1 — protocolo Aquiles: nada sube mientras el congelamiento esté activo */
  const fr=aqFrozen();
  if(fr&&x.aq>=1&&p.valor>prev){
    toast('🧊 No aplicado — '+x.n+' está congelado por Aquiles hasta el '+fr,1);
    return;
  }
  /* BARANDA 2 — tope de subida: +5 kg compuestos/máquinas, +2 kg aislamientos.
     En máquinas de torre el tope se mide en POSICIONES, no en kg: un tope de 2 kg
     en una torre que salta de 4.5 no protege, bloquea para siempre. Máximo una
     posición por aplicación, y el valor se encaja en un peso que exista. */
  const iso=/^iso_/.test(x.pat)||x.pat==='core',cap=iso?2:5;
  let val=p.valor,cut=false;
  const si=Array.isArray(x.stk)?x.stk.indexOf(prev):-1;
  if(si>=0){
    let j=x.stk.findIndex(v=>v>=val);if(j<0)j=x.stk.length-1;
    if(j>si+1){j=si+1;cut=true}
    if(j<0)j=0;
    val=x.stk[j];
  }else if(prev>0&&val>prev+cap){val=prev+cap;cut=true}
  x.w.v=val;if(p.porLado!=null)x.w.ps=!!p.porLado;delete x.w.bw;
  if(!WH[p.ex])WH[p.ex]=[];
  WH[p.ex].push({d:tds(),v:val,ps:x.w.ps,w:wLabel(x.w)});
  if(p.esquema&&p.esquema.length){
    const esq=p.esquema.map(s=>cut&&s>val?val:s);
    [1,2,3,4,5,6].forEach(d=>{const it=(PLAN.days[d].it||[]).find(t=>t.e===p.ex);if(it)it.sc=esq.slice()});
    save(K.plan,PLAN);
  }
  DIARY.push({d:tds(),ex:p.ex,ok:true,v:val,prev,m:p.motivo,cap:cut?p.valor:null});
  save(K.diary,DIARY);save(K.cat,CAT);save(K.wh,WH);
  props.splice(i,1);st('g2_props',props);
  rCoach();
  if(cut)toast('✓ Aplicado con tope: '+x.n+' → '+val+' kg (pedía '+p.valor+')',1);
  else toast('✓ Aplicado: '+x.n+' → '+val+' kg');
}

  PLAN.days[d].it.push({e,s,r});save(K.plan,PLAN);editPlan();setTimeout(()=>{document.getElementById('pd').value=d;planDay(d)},50);
}
function expData(){
  const d={cat:CAT,plan:PLAN,log:LOG,wh:WH,ms:MS,ai:AI,diary:DIARY,v:2,exported:new Date().toISOString()};
  const b=new Blob([JSON.stringify(d,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ascentpeak-'+tds()+'.json';a.click();URL.revokeObjectURL(a.href);
  toast('Respaldo descargado');
}
function impData(){
  const i=document.createElement('input');i.type='file';i.accept='.json';
  i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);
      if(d.cat)CAT=d.cat;if(d.plan)PLAN=d.plan;if(d.log)LOG=d.log;if(d.wh)WH=d.wh;if(d.ms)MS=d.ms;if(d.ai)AI=d.ai;if(d.diary)DIARY=d.diary;
      st(K.cat,CAT);st(K.plan,PLAN);st(K.log,LOG);st(K.wh,WH);st(K.ms,MS);st(K.ai,AI);st(K.diary,DIARY);
      fullSync();toast('Datos restaurados');go('entrenar');
    }catch(e){alert('Archivo no válido')}};
    r.readAsText(f)};
  i.click();
}
/* ============ FIREBASE ============ */
const SK={};SK[K.cat]='cat2';SK[K.plan]='plan';SK[K.wh]='wh';SK[K.ms]='ms';SK[K.ai]='ai2';SK[K.diary]='diary';
let FBU=null,BUSY=false,tmr=null;
function dirty(){return ld('g2_dirty',{k:[],l:[]})}
function setD(d){st('g2_dirty',d)}
function markDirty(k){const s=SK[k];if(!s)return;const d=dirty();if(!d.k.includes(s)){d.k.push(s);setD(d)}chip();queue()}
function touchLog(ds){const d=dirty();if(!d.l.includes(ds)){d.l.push(ds);setD(d)}chip();queue()}
function fullSync(){setD({k:Object.values(SK),l:Object.keys(LOG)});chip();queue()}
function queue(){if(tmr)clearTimeout(tmr);tmr=setTimeout(push,2500)}
async function push(){
  if(!window.FB||!FBU||BUSY||!navigator.onLine)return chip();
  const d0=dirty();if(!d0.k.length&&!d0.l.length)return chip();
  BUSY=true;chip('s');
  try{
    const F=window.FB,V={cat2:CAT,plan:PLAN,wh:WH,ms:MS,ai2:AI,diary:DIARY};
    for(const s of d0.k.slice()){
      if(V[s]!=null)await F.setDoc(F.doc(F.db,'users',FBU.uid,'data',s),{d:JSON.parse(JSON.stringify(V[s])),u:Date.now()});
      const dd=dirty();dd.k=dd.k.filter(x=>x!==s);setD(dd);
      const ru=ld('g2_ru',{});ru['data/'+s]=Date.now();st('g2_ru',ru);
    }
    for(const ds of d0.l.slice()){
      if(LOG[ds])await F.setDoc(F.doc(F.db,'users',FBU.uid,'log',ds),{d:JSON.parse(JSON.stringify(LOG[ds])),u:Date.now()});
      const dd=dirty();dd.l=dd.l.filter(x=>x!==ds);setD(dd);
      const ru=ld('g2_ru',{});ru['log/'+ds]=Date.now();st('g2_ru',ru);
    }
  }catch(e){console.error(e)}
  BUSY=false;chip();
}
async function pull(){
  if(!window.FB||!FBU||!navigator.onLine)return;
  chip('s');
  try{
    const F=window.FB,ru=ld('g2_ru',{});let ch=false;
    const dd=await F.getDocs(F.collection(F.db,'users',FBU.uid,'data'));
    dd.forEach(s=>{
      const r=s.data();if(!(r.u>(ru['data/'+s.id]||0)))return;
      if(s.id==='cat2'){CAT=r.d;const mg=migCat();st(K.cat,CAT);if(mg&&window.__ready)markDirty(K.cat)}
      if(s.id==='plan'){PLAN=r.d;st(K.plan,PLAN)}
      if(s.id==='wh'){WH=r.d;st(K.wh,WH)}
      if(s.id==='ms'){MS=r.d;st(K.ms,MS)}
      if(s.id==='ai2'){AI=r.d;st(K.ai,AI)}
      if(s.id==='diary'){DIARY=r.d;st(K.diary,DIARY)}
      ru['data/'+s.id]=r.u;ch=true;
    });
    const ld2=await F.getDocs(F.collection(F.db,'users',FBU.uid,'log'));
    ld2.forEach(s=>{const r=s.data();if(r.u>(ru['log/'+s.id]||0)){LOG[s.id]=r.d;ru['log/'+s.id]=r.u;ch=true}});
    st('g2_ru',ru);
    if(ch){st(K.log,LOG);MEAS.forEach(m=>{if(!MS[m.k])MS[m.k]=[]});rEntrenar()}
  }catch(e){console.error(e)}
  chip();
}
function chip(s){
  const c=document.getElementById('sync');if(!c)return;
  if(!window.FB){c.textContent='☁️';c.className='chip';return}
  if(!FBU){c.textContent='☁️ conectar';c.className='chip';return}
  if(s==='s'){c.textContent='☁️ ⟳';c.className='chip';return}
  if(!navigator.onLine){c.textContent='☁️ offline';c.className='chip warn';return}
  const d=dirty(),n=d.k.length+d.l.length;
  c.textContent=n?'☁️ '+n+'↑':'☁️ ✓';c.className='chip '+(n?'warn':'ok');
}
function syncTap(){
  if(!window.FB){toast('Cargando Firebase…');return}
  if(!FBU){login();return}
  openM(`<h2>☁️ Sincronización</h2><div class="sub">Conectado como <b>${esc(FBU.email||'')}</b></div>
  <div class="mb"><button onclick="logout()">Cerrar sesión</button><button class="ok" onclick="closeM();pull().then(push)">Sincronizar</button></div>`);
}
function login(){
  if(!window.FB)return;
  window.FB.signInWithPopup(window.FB.auth,window.FB.provider).catch(e=>{
    const c=e&&e.code||'';
    if(c.includes('popup'))window.FB.signInWithRedirect(window.FB.auth,window.FB.provider).catch(x=>alert('Login: '+(x.code||x.message)));
    else alert('Error: '+(c||e.message));
  });
}
function logout(){closeM();if(window.FB)window.FB.signOut(window.FB.auth)}
function fbInit(F){
  window.FB=F;
  F.onAuthStateChanged(F.auth,async u=>{
    FBU=u;chip();
    if(u){if(!localStorage.getItem('g2_first')){fullSync();localStorage.setItem('g2_first','1')}await pull();await push()}
  });
  window.addEventListener('online',()=>{chip();push()});
  window.addEventListener('offline',chip);
  setInterval(()=>{const d=dirty();if(d.k.length||d.l.length)push()},60000);
  chip();
}
/* ============ MODAL / INIT ============ */
function openM(h){document.getElementById('modal').innerHTML=h;document.getElementById('mbg').classList.add('on')}
function closeM(){document.getElementById('mbg').classList.remove('on')}
window.__ready=true;
rEntrenar();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
